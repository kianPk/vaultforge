<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VaultForge</title>
<link rel="stylesheet" href="./style.css"/>
</head><body>
<div class="shell">
<header class="top"><div class="brand"><h1>VaultForge</h1><p>Solidity · Foundry · lab demo</p></div><span class="chip" id="net">demo mode</span></header>
<section class="hero"><p class="kicker">ERC-4626 yield vault</p><h2>Deposit. Allocate. Harvest. Watch fees mint to the recipient.</h2></section>
<section class="kpis" id="kpis"></section>
<div class="layout">
<aside class="panel"><h3>Controls</h3>
<label>Deposit assets<input id="amt" type="number" value="100000"/></label>
<label>Allocate %<input id="alloc" type="number" value="80"/></label>
<div id="actions"></div></aside>
<section class="panel"><h3>Event log</h3><pre class="log" id="log"></pre></section>
</div>
<footer><span>kianPk / vaultforge</span><a href="https://github.com/kianPk/vaultforge" target="_blank" rel="noopener">source</a></footer>
</div>
<script src="./app.js"></script>
</body></html>
